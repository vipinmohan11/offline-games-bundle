<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12162b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dice Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--blue:#2997ff;--line:rgba(255,255,255,.14);--bg:#12162b;--card:#1d2342;--card2:#262d54;--text:#f1f3ff;--muted:#9aa3c7;--gold:#ffd43b;--good:#69db7c;--bad:#ff6b6b;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));-webkit-overflow-scrolling:touch}
.hidden{display:none!important}
.wrap{max-width:1100px;margin:0 auto}
button{font:inherit;color:inherit;border:0;border-radius:14px;background:var(--card2);padding:12px 16px;min-height:48px;cursor:pointer;font-weight:700}
button:active{transform:scale(.97)}
button.pri{background:linear-gradient(#ffd43b,#fab005);color:#3a2a00}
button.ghost{background:transparent;border:2px solid var(--card2)}
.bar{height:12px;background:#0e1226;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ffd43b,#ff922b);border-radius:99px;width:0;transition:width .5s}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hdr h2{margin:0;font-size:clamp(20px,4.5vw,28px);flex:1}
.how{background:var(--card);padding:10px 14px;border-radius:14px;color:var(--muted);font-size:14px;margin-bottom:10px;font-weight:500}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;background:var(--card)}
.tabs button.on{background:var(--c,#7c5cff);color:#fff}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:10px}
.lv{aspect-ratio:1;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card);position:relative;min-height:64px}
.lv b{font-size:20px}.lv small{font-size:10px;letter-spacing:-1px;min-height:13px;white-space:nowrap}
.lv.cur{outline:3px solid var(--gold)}.lv.lock{opacity:.4}.lv .ch{position:absolute;top:2px;right:4px;font-size:13px}
.note{color:var(--muted);font-size:14px;margin:8px 2px}
#play{display:flex;flex-direction:column;padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));overflow:hidden;gap:6px}
#hud{display:flex;align-items:center;gap:8px}
#hud button{min-height:44px;width:46px;padding:0;flex:none}
.hmid{flex:1;min-width:0}
#hudTitle{font-size:13px;color:var(--muted);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{position:relative;height:16px;background:#0e1226;border-radius:99px;margin-top:6px}
.meter>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#74c0fc,#69db7c);width:0}
.meter u{position:absolute;top:-5px;transform:translateX(-50%);font-size:18px;text-decoration:none;filter:grayscale(1) brightness(.6)}
.meter u.on{filter:none}
.tbar{height:5px;background:#0e1226;border-radius:99px;margin-top:5px;overflow:hidden}.tbar>i{display:block;height:100%;background:#ff922b;width:100%}
.hr{text-align:right;min-width:92px}
#hudScore{font-size:26px;font-weight:900;line-height:1;color:var(--gold)}
#hudLeft{font-size:13px;color:var(--muted);font-weight:800}
#stage{flex:1;min-height:0;position:relative;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#say{position:absolute;left:0;right:0;top:12%;text-align:center;font-size:clamp(24px,6vw,44px);font-weight:900;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.5);pointer-events:none;opacity:0}
#say.go{animation:pop 1.1s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#ctl{display:flex;gap:8px;justify-content:center}
#ctl button{flex:1;max-width:190px;min-height:56px;font-size:22px;background:var(--card2)}
#ctl.none{display:none}
#modal{position:fixed;inset:0;background:rgba(5,8,20,.78);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.dlg{background:var(--card);border-radius:24px;padding:20px;width:min(94vw,460px);max-height:92vh;overflow:auto;text-align:center}
.dlg h2{margin:0 0 6px;font-size:26px}
.dlg .big{font-size:40px;font-weight:900;color:var(--gold)}
.dlg .sub{color:var(--muted);font-size:14px;margin-bottom:8px;font-weight:600}
.stars{font-size:56px;letter-spacing:6px;margin:4px 0}
.stars span{display:inline-block;filter:grayscale(1) brightness(.5);transform:scale(.6);transition:all .35s cubic-bezier(.3,1.6,.5,1)}
.stars span.on{filter:none;transform:scale(1)}
.thr{display:flex;justify-content:center;gap:12px;font-size:13px;color:var(--muted);margin:6px 0 10px;font-weight:700;flex-wrap:wrap}
.rew{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.pill{background:var(--card2);border-radius:999px;padding:8px 14px;font-weight:800}
.pill.gold{background:#5c4a00;color:var(--gold)}
.reveal{background:var(--card2);border-radius:16px;padding:10px;margin:8px 0;font-weight:700}
.reveal .em{font-size:44px}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.btns button{flex:1;min-width:110px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.stk{aspect-ratio:1;border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:34px}
.stk.no{opacity:.35;filter:grayscale(1)}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.skin{background:var(--card);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.skin.sel{outline:3px solid var(--gold)}
.skin .sw{display:flex;gap:3px}.skin .sw i{width:20px;height:20px;border-radius:6px;display:block}
.gdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.gdays div{background:var(--card2);border-radius:10px;padding:6px 0;font-size:12px;font-weight:800}
.gdays div.on{background:var(--gold);color:#3a2a00}
h3{margin:14px 2px 8px}
@media (prefers-reduced-motion:reduce){#say.go{animation:none;opacity:1}}

.set{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.set h3{margin:0 0 8px;font-size:16px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.06)}
.srow:first-of-type{border-top:0}
.srow label,.srow .lbl{font-weight:700;flex:1}.srow small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.seg button{min-height:40px;padding:6px 12px;background:var(--card2)}.seg button.on{background:var(--gold);color:#3a2a00}
.tg{min-width:76px;min-height:40px;padding:6px 12px}.tg.on{background:var(--good);color:#06310f}
input[type=range]{width:150px;accent-color:#ffd43b}
.set input[type=text],.set textarea{width:100%;background:#0e1226;color:var(--text);border:2px solid var(--card2);border-radius:12px;padding:10px;font:inherit}
.set textarea{min-height:70px;font-size:12px}
.reduce *{animation-duration:.01ms!important;transition-duration:.01ms!important}
body.lefty #ctl{flex-direction:row-reverse}
body.bigbtn #ctl button{min-height:76px;font-size:26px}
body.t-ocean{--bg:#0b2233;--card:#123a52;--card2:#1b5373}
body.t-candy{--bg:#2b1236;--card:#43204f;--card2:#5e2d6e}
body.t-forest{--bg:#0f2417;--card:#183a26;--card2:#255238}

/* level select: compact, tiles stay small */
.hdr{gap:8px}.hdr h2{font-size:clamp(16px,4vw,22px);white-space:nowrap;flex:none}
.hdr .tabs{margin:0;flex:1;justify-content:center;max-width:320px}.tabs button{min-height:40px;padding:6px 10px;border-radius:12px}
#lvHelp{width:40px;min-height:40px;padding:0;border-radius:50%;font-size:18px;flex:none}
.lvgrid{grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.lv{min-height:54px;border-radius:12px;border:2px solid var(--card2);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.lvfoot{position:sticky;bottom:0;display:flex;gap:8px;padding:8px 0;background:var(--bg);align-items:stretch;margin-top:8px}
.lvfoot .pri{flex:1;min-height:52px;font-size:18px}
.chal{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--card2);border-radius:14px;padding:0 12px;font-weight:800;min-width:92px;justify-content:center}.chal.off{opacity:.45}
.chal input{width:20px;height:20px;accent-color:#ffd43b}
.note.leg{font-size:12px;text-align:center}
/* play screen, landscape: HUD in a left rail, controls in a right rail, board takes the full height */
@media (orientation:landscape) and (min-width:560px){
  #play{display:grid;grid-template-columns:minmax(110px,160px) 1fr minmax(84px,128px);grid-template-rows:1fr;gap:8px}
  #hud{grid-column:1;grid-row:1;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:8px}
  #hud button{width:46px}
  .hmid{flex:none}.hr{text-align:left;min-width:0}
  #hudScore{font-size:30px}
  #stage{grid-column:2;grid-row:1}
  #ctl{grid-column:3;grid-row:1;flex-direction:column;justify-content:flex-end;align-items:stretch}
  #ctl button{max-width:none;flex:none;min-height:64px;font-size:20px}
  #ctl.none{display:none}
  body.lefty #hud{grid-column:3}body.lefty #ctl{grid-column:1}
  #hudTitle{white-space:normal;line-height:1.15}
}
@media (max-width:520px){.hdr{flex-wrap:wrap}.hdr h2{flex:1}.hdr .tabs{order:5;flex-basis:100%;max-width:none}}

/* urgency: calm -> orange (under 25%) -> red (last 10 s). Colour is paired with an icon change and a pulse. */
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:10px;opacity:0}
#play[data-urg="1"] .tbar i{background:#ff922b}
#play[data-urg="2"] .tbar i{background:#ff4d4d}
#play[data-urg="2"] #hudLeft{color:#ff6b6b}
#play[data-urg="1"] #stage::after{box-shadow:inset 0 0 0 3px rgba(255,146,43,.55);opacity:1}
#play[data-urg="2"] #stage::after{box-shadow:inset 0 0 0 4px rgba(255,77,77,.8);animation:urgp 1s ease-in-out infinite}
@keyframes urgp{50%{opacity:.25}}

/* album: missing stickers are grey silhouettes with a ?, new ones carry a gold dot */
.stk{position:relative;border:2px solid var(--card2)}
.stk.no{opacity:1;filter:none}.stk.no span{filter:brightness(0);opacity:.22}
.stk u{position:absolute;text-decoration:none;font-size:16px;font-weight:900;color:var(--muted);z-index:1}
.stk .nw{position:absolute;top:3px;right:3px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid var(--bg)}
.dock button.dot{position:relative}.dock button.dot::after{content:"";position:absolute;top:4px;right:6px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid var(--bg)}
.skin button.poor{background:var(--card2);color:var(--bad)}

.em.shake{display:inline-block;animation:shk .45s ease-in-out infinite}
@keyframes shk{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}

/* squish and bounce: buttons dip on press and spring back; the score bumps when it grows */
button{transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s}
button:active{transform:scale(.95) translateY(2px)}
#hudScore{display:inline-block}
#hudScore.bump{animation:bump .16s ease-out}
@keyframes bump{50%{transform:scale(1.18)}}
.gcard,.lv{transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s}

/* ---- v2.1: bold arcade start page, goal intro, score/goal HUD ---- */
#hudScore small{font-size:13px;font-weight:800;color:var(--muted);margin-left:4px}
#hudGoal{font-size:11px;color:#b8c0e8;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
@media (orientation:landscape) and (max-height:620px){#hudGoal{white-space:normal;line-height:1.15}}
.intro{text-align:center}
.intro h2{margin:0 0 8px}
.ipanels{display:flex;align-items:stretch;justify-content:center;gap:4px}
.ip{flex:1;min-width:0;background:#1b2040;border:3px solid #0b0e1f;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;animation:ipl 3s ease-in-out infinite}
.ip:nth-child(3){animation-delay:1s}.ip:nth-child(5){animation-delay:2s}
.ip b{font-size:clamp(20px,6vw,30px);line-height:1.1;white-space:nowrap}
.ip small{font-size:12px;font-weight:700;color:var(--muted);line-height:1.2}
.ia{align-self:center;color:var(--gold);font-size:14px}
@keyframes ipl{0%,100%{transform:scale(1);border-color:#0b0e1f}15%,30%{transform:scale(1.07);border-color:#ffd43b;background:#2a3060}45%{transform:scale(1)}}
.goalp{font-size:15px;margin:12px 0 8px}
.skipbar{height:6px;background:#0e1226;border-radius:9px;overflow:hidden}.skipbar i{display:block;height:100%;width:0;background:#ffd43b;animation:skipb linear forwards}
@keyframes skipb{to{width:100%}}
.taphint{font-size:12px;color:var(--muted);margin-top:6px;font-weight:700}
body.reduce .ip{animation:none}
/* intro panels: three equal columns, text never spills out */
.ipanels{gap:2px}
.ip{flex:1 1 0;min-width:0;overflow:hidden;padding:10px 4px}
.ip b{font-size:clamp(15px,4.8vw,26px);white-space:normal;overflow-wrap:anywhere;line-height:1.15;max-width:100%}
.ip small{font-size:clamp(11px,3vw,13px)}
.ia{flex:none;width:14px;text-align:center;font-size:10px}

.why{background:#3b1f2b;color:#ffb3c1;border-radius:10px;padding:8px 10px;font-weight:700;font-size:14px;margin:6px 0}
.losep{font-size:13px;color:#ffb3c1;font-weight:700;margin:0 0 8px}

/* ======== v2.1 Apple-website look for the pages around the games ======== */
body.lk-light #home,body.lk-light #levels,body.lk-light #album,body.lk-light #settings{--bg:#f5f5f7;--card:#ffffff;--card2:#e8e8ed;--text:#1d1d1f;--muted:#6e6e73;--blue:#0071e3;--line:#d2d2d7;--gold:#b7791f}
#home,#levels,#album,#settings{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#home button,#levels button,#album button,#settings button{border-radius:980px;font-weight:600;letter-spacing:-.01em;box-shadow:none}
#home button.pri,#levels button.pri,#album button.pri,#settings button.pri{background:var(--blue);color:#fff}
#home button.pri.poor,#album button.pri.poor{background:var(--card2);color:var(--muted)}
.chip{background:var(--card);padding:6px 12px;border-radius:980px;font-weight:600;white-space:nowrap;border:1px solid var(--line);font-size:14px}
.bar,.rbar{background:var(--card2)}
.rbar i,.bar>i{background:var(--blue)}
.hub{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding:0 max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));max-width:900px;margin:0 auto}
.anav{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line);margin:0 -14px;padding-left:14px;padding-right:14px}
.alogo{font-size:17px;font-weight:600;letter-spacing:-.02em}
.aright{display:flex;align-items:center;gap:8px}
.prof{min-height:32px!important;padding:3px 12px 3px 6px!important;background:var(--card)!important;border:1px solid var(--line)!important;font-size:13px!important;display:flex;align-items:center;gap:6px}
#pAv{font-size:18px}
.hero{text-align:center;padding:6px 0 2px}
.hero h1{margin:0;font-size:clamp(28px,8.4vw,48px);line-height:1.05;letter-spacing:-.03em;font-weight:700}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero .sub{margin:6px 0 8px;color:var(--muted);font-size:14px;font-weight:400}
.hero .rbar{width:min(220px,60%);height:4px;margin:0 auto;border-radius:4px;overflow:hidden}
.cards{flex:1;min-height:0;display:grid;gap:6px;grid-template-columns:1fr;grid-auto-rows:minmax(0,60px);align-content:center}
.gcard{display:grid!important;grid-template-columns:44px 1fr auto 12px;gap:12px;align-items:center;text-align:left;padding:8px 14px 8px 10px!important;height:100%;min-height:0!important;border-radius:16px!important;background:var(--card)!important;color:var(--text)!important;border:0!important;box-shadow:none!important;text-shadow:none!important;font-weight:400!important}
.gcard:active{transform:scale(.985);filter:brightness(.96)}
.gcard .ic{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--card2);background:color-mix(in srgb,var(--c) 18%,var(--card))}
.gcard .tx{min-width:0;display:flex;flex-direction:column}
.gcard .nm{font-size:16px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.gcard .tx small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.gcard .sbar{display:none}
.gcard .meta{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--muted)}
.gcard .meta b{font-size:13px;font-weight:600;color:var(--text)}
.gcard .go{color:var(--blue);font-size:22px;line-height:1}
.dock{display:flex;gap:8px}
.dock button{flex:1;min-height:44px;padding:4px 6px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:18px;background:var(--card2)!important;color:var(--text)!important}
.dock small{font-size:12px;font-weight:600;color:var(--text)}
#gift.rdy{background:var(--blue)!important;color:#fff!important}#gift.rdy small{color:#fff}
.dock button.dot{position:relative}.dock button.dot::after{content:"";position:absolute;top:6px;right:10px;width:9px;height:9px;border-radius:50%;background:#ff3b30}
@media (min-width:700px){.cards{grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,64px);gap:10px}.hero h1{font-size:clamp(34px,5vw,52px)}}
@media (orientation:landscape) and (max-height:560px){.hero h1{font-size:26px}.hero .sub{display:none}.cards{grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,52px);gap:6px}.hero{padding:0}}
/* level select, shop, settings: same white tiles on light grey */
#levels .lv,#album .skin,#album .pu,#album .av,#album .tl,#album .stk,#settings .set{background:var(--card);border:1px solid var(--line);box-shadow:none}
#levels .lv{border-radius:12px}
#levels .lv.cur{outline:2px solid var(--blue);outline-offset:1px}
#levels .tabs button{background:var(--card2)}#levels .tabs button.on{background:var(--text);color:var(--bg)}
#levels .how,#levels .note,#album .note{color:var(--muted)}
#levels .lvfoot{background:var(--bg)}
#levels .chal{background:var(--card);border:1px solid var(--line)}
#levels .pill,#album .pill{background:var(--card2);color:var(--text)}
#settings .set input[type=text],#settings .set textarea{background:var(--bg);color:var(--text);border:1px solid var(--line)}
#settings .srow{border-top-color:var(--line)}
#settings .seg button{background:var(--card2)}#settings .seg button.on{background:var(--blue);color:#fff}
#settings .tg.on{background:#34c759;color:#fff}
#album .skin.sel,#album .av.sel,#album .tl.sel{outline:2px solid var(--blue)}
#album .stk.no{background:var(--card2)}
.pus{display:grid;gap:8px}
.pu{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:16px}
.pu .pi{font-size:24px;text-align:center;font-weight:700}.pu .pt{display:flex;flex-direction:column}.pu .pt small{color:var(--muted);font-size:12px;font-weight:400}
.pu .pr{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.pu .pr small{color:var(--muted);font-size:11px}
.pu button{min-height:34px;padding:4px 14px}
.bsw{width:100%;height:28px;border-radius:8px;border:1px solid rgba(0,0,0,.15)}
.avs{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.av{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px!important;border-radius:14px!important;min-height:0!important}.av span{font-size:28px}.av small{font-size:11px;color:var(--muted)}.av.lockd span{filter:grayscale(.6);opacity:.7}
.tls{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tl{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px!important;border-radius:14px!important}.tl small{font-size:11px;color:var(--muted);font-weight:400}
/* power-up buttons while playing (dark play screen) */
#pwr{display:flex;gap:6px;justify-content:center}#pwr.none{display:none}
.pwb{min-height:36px!important;padding:4px 12px!important;font-size:13px;border-radius:999px!important;background:#262d54;display:flex;align-items:center;gap:6px}
.pwb b{background:#ffd43b;color:#3a2a00;border-radius:999px;padding:0 7px;font-size:12px}
.pwb.none0{opacity:.5}.pwb.used{opacity:.4}
@media (orientation:landscape) and (min-width:560px){#pwr{grid-column:1;grid-row:1;align-self:end;flex-direction:column;align-items:stretch}body.lefty #pwr{grid-column:3}}
.alogo{white-space:nowrap;font-size:16px}
#pName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.prof{max-width:200px}
@media (max-width:400px){#pName{max-width:70px}}

  </div></section>

</div>

<script>
/* ---- prog.js ---- */
'use strict';
/* Progression: levels, stars, coins, XP, ranks, chests, stickers, timed medals.
   Pure functions over a save object so they can be tested in Node. */
var Prog = (function () {
  var LEVELS = 50;               // 1-40 guided path, 41-50 Endless Ladder
  var GUIDED = 40;
  var STAR_GAP = 0.20;
  var MEDAL_MULT = [0.5, 1.0, 1.6];       // bronze, silver, gold as multiples of timedPar * timedSecs
  var MEDAL_COINS = [15, 30, 60];
  var STICKER_COUNT = 64;

  // Share of "par" a player must score for 1 star on a level. Rises every level: 0.25 -> 0.85
  function f1(l) {
    if (l <= GUIDED) return 0.25 + 0.60 * (l - 1) / (GUIDED - 1);
    return 0.85 + 0.25 * Math.log(1 + (l - GUIDED) / 8);          // Endless Ladder: slow, never a jump
  }
  // Difficulty index 0..1 (1 = Level 40 and beyond), pace pressure, target pass rate, mistake allowance
  function D(l) { return Math.pow((Math.min(l, GUIDED) - 1) / (GUIDED - 1), 0.85); }
  function rho(l) { return l <= GUIDED ? 0.55 + 0.55 * D(l) : Math.min(1.25, 1.10 + 0.05 * Math.log(1 + (l - GUIDED) / 10)); }
  function pTarget(l) { return 0.95 - 0.65 * Math.pow(D(l), 1.2) - (isBoss(l) ? 0.10 : 0); }
  function allowedMistakes(l) { return Math.round(5 - 3 * D(l)); }
  function isBoss(l) { return l % 10 === 0; }
  // Style 0..100 = accuracy, goal progress, streak. Stars never use it (they stay on the Base score).
  function styleOf(mistakes, allowed, goal, streakFrac) {
    var acc = Math.max(0, 1 - mistakes / Math.max(1, allowed));
    return Math.round(100 * (0.5 * acc + 0.3 * Math.max(0, Math.min(1, goal)) + 0.2 * Math.max(0, Math.min(1, streakFrac))));
  }
  function styleRank(s) { return s >= 90 ? 'S' : s >= 75 ? 'A' : s >= 55 ? 'B' : 'C'; }

  function thresholds(G, l) {
    if (G.thresholds) return G.thresholds(l);
    var base = G.par * G.budget(l), a = f1(l);
    return [a, a + STAR_GAP, a + 2 * STAR_GAP].map(function (f) { return Math.round(f * base); });
  }
  function starsFor(G, l, score, res) {
    if (G.stars) return G.stars(l, res || { score: score });
    var t = thresholds(G, l);
    return score >= t[2] ? 3 : score >= t[1] ? 2 : score >= t[0] ? 1 : 0;
  }
  function timedThr(G) {
    return MEDAL_MULT.map(function (m) { return Math.round(m * G.timedPar * G.timedSecs); });
  }
  function medalFor(G, score) {
    var t = timedThr(G);
    return score >= t[2] ? 3 : score >= t[1] ? 2 : score >= t[0] ? 1 : 0;
  }

  function newSave() {
    return { v: 1, coins: 0, xp: 0, stars: {}, best: {}, timed: {}, chests: {}, stickers: [], stamps: {}, bosses: {}, tokens: 0, seenStk: 0, inv: { time: 0, x2: 0, slow: 0 }, boards: [0], board: 0, avatars: [], avatar: '', titles: [0], title: 0, stkClaimed: 0,
      skin: 0, skins: [0], gift: { last: '', streak: 0 }, sound: true, flowers: 0, plays: 0, seen: {} };
  }
  function rankOf(xp) {
    var r = 1, need = 80;

    return { rank: r, into: xp, need: need };
  }
  function isUnlocked(save, g, l) { return l === 1 || ((save.stars[g] || {})[l - 1] || 0) >= 1; }

    var s = save.stars[g] || {}, n = 0;
    for (var k in s) n += s[k];
    return n;
  }
  function coinsForStars(l, from, to) {

    return c;
  }
  function chestCoins(l) { return 25 + 2 * l; }

  function giveSticker(save, rng) {
    var have = {}, i, free = [];
    save.stickers.forEach(function (s) { have[s] = 1; });
    for (i = 0; i < STICKER_COUNT; i++) if (!have[i]) free.push(i);

    var id = free[Math.floor(rng() * free.length)];
    save.stickers.push(id);
    return id;
  }

    var before = rankOf(save.xp).rank;

    res.xp += amount;

    for (var r = before + 1; r <= after; r++) {
      var c = 15 * r, st = giveSticker(save, rng);

      res.coins += c;

    }
  }

    }

    if (score > (save.best[bk] || 0)) { save.best[bk] = score; res.newBest = true; }

      save.chests[bk] = 1;
      var cc = chestCoins(l);

      res.coins += cc;

    }

  }

  function applyTimed(save, G, score, rng) {
    var g = G.id;
    var res = { coins: 0, rankCoins: 0, xp: 0, medal: medalFor(G, score), oldMedal: 0, best: 0, newBest: false, ranks: [] };

    save.plays++;
    for (var m = t.medal + 1; m <= res.medal; m++) res.coins += MEDAL_COINS[m - 1];
    if (res.medal > t.medal) t.medal = res.medal;
    if (score > t.best) { t.best = score; res.newBest = true; res.coins += 5; }

    res.best = t.best;
    save.coins += res.coins;
    addXp(save, 5 + Math.floor(score / 60) + 6 * res.medal, rng, res);
    return res;
  }

  // Daily gift. today = 'YYYY-MM-DD'. Streak 1..7 then repeats.
  function dayDiff(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5); }
  function giftReady(save, today) { return save.gift.last !== today; }
  function claimGift(save, today, rng) {
    if (!giftReady(save, today)) return null;
    var streak = (save.gift.last && dayDiff(save.gift.last, today) === 1) ? save.gift.streak + 1 : 1;
    if (streak > 7) streak = 1;
    save.gift.last = today;
    save.gift.streak = streak;
    var coins = 20 * streak, st = streak === 7 ? giveSticker(save, rng) : null;
    save.coins += coins;
    return { coins: coins, streak: streak, sticker: st };
  }

  // Collection bonus: every 8 stickers pays a reward (coins or power-ups, the last one an avatar).
  var STK_STEP = 8;
  var STK_REWARDS = [{ coins: 150 }, { pu: 'time', n: 2 }, { coins: 250 }, { pu: 'x2', n: 2 }, { coins: 350 }, { pu: 'slow', n: 2 }, { coins: 450 }, { coins: 600, pu: 'time', n: 3 }];
  function stickerBonus(save) {
    var out = [];
    while (save.stkClaimed < STK_REWARDS.length && save.stickers.length >= (save.stkClaimed + 1) * STK_STEP) {
      var r = STK_REWARDS[save.stkClaimed]; save.stkClaimed++;
      if (r.coins) save.coins += r.coins;
      if (r.pu) save.inv[r.pu] = (save.inv[r.pu] || 0) + r.n;
      out.push(r);

  }
  return { STK_STEP: STK_STEP, STK_REWARDS: STK_REWARDS, stickerBonus: stickerBonus, LEVELS: LEVELS, STAR_GAP: STAR_GAP, MEDAL_MULT: MEDAL_MULT, MEDAL_COINS: MEDAL_COINS, STICKER_COUNT: STICKER_COUNT,
    f1: f1, D: D, rho: rho, pTarget: pTarget, allowedMistakes: allowedMistakes, isBoss: isBoss, styleOf: styleOf, styleRank: styleRank, GUIDED: GUIDED, thresholds: thresholds, starsFor: starsFor, timedThr: timedThr, medalFor: medalFor,
    newSave: newSave, rankOf: rankOf, isUnlocked: isUnlocked, totalStars: totalStars,
    coinsForStars: coinsForStars, chestCoins: chestCoins, applyLevel: applyLevel, applyTimed: applyTimed,
    giftReady: giftReady, claimGift: claimGift };
})();
if (typeof module !== 'undefined') module.exports = Prog;

/* ---- common.js ---- */
'use strict';
/* Shared helpers: RNG, dice drawing, skins, and the Run engine (works headless for bot tests). */
var Games = {};

function mulberry(a) {

var SKINS = [
  { name: 'Classic', price: 0,    faces: ['#ff8787', '#ffc078', '#ffe066', '#8ce99a', '#74c0fc', '#d0bfff'], pip: '#2b2b44', bg: '#1f2a44' },
  { name: 'Candy',   price: 150,  faces: ['#ff99c8', '#fcf6bd', '#d0f4de', '#a9def9', '#e4c1f9', '#ffb88c'], pip: '#4a2c4f', bg: '#3b2a4f' },
  { name: 'Sunset',  price: 300,  faces: ['#ff595e', '#ff924c', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93'], pip: '#ffffff', bg: '#2b1d3a' },
  { name: 'Ocean',   price: 500,  faces: ['#ef476f', '#ffd166', '#06d6a0', '#118ab2', '#9bf6ff', '#c8b6ff'], pip: '#073b4c', bg: '#073b4c' },
  { name: 'Forest',  price: 800,  faces: ['#e07a5f', '#f2cc8f', '#81b29a', '#a7c957', '#6a994e', '#bc6c25'], pip: '#1b2a1b', bg: '#233a2a' },
  { name: 'Neon',    price: 1200, faces: ['#ff2e63', '#ff9f1c', '#f9f871', '#08fdd8', '#3a86ff', '#c77dff'], pip: '#101020', bg: '#10101c' },
  { name: 'Gold',    price: 1800, faces: ['#ffd700', '#ffb703', '#fb8500', '#f4a261', '#e9c46a', '#ffe8a3'], pip: '#4a3000', bg: '#3a2a10' },
  { name: 'Galaxy',  price: 2400, faces: ['#7b2cbf', '#3c096c', '#5a189a', '#9d4edd', '#c77dff', '#e0aaff'], pip: '#ffffff', bg: '#10002b' }
];

  { name: 'Classic', price: 0,   bg: null },
  { name: 'Wood',    price: 250, bg: '#6b4423', pat: 'lines' },
  { name: 'Space',   price: 400, bg: '#0b1030', pat: 'stars' },
  { name: 'Paper',   price: 300, bg: '#cfc4a8', pat: 'grid' },
  { name: 'Mint',    price: 350, bg: '#1d5c4e', pat: 'dots' }
];
var Board = { i: 0, cur: BOARDS[0] };
function setBoard(i) { Board.i = i; Board.cur = BOARDS[i] || BOARDS[0]; }
/* Power-ups: used from the play screen, once per run each. */
var POWERUPS = [
  { id: 'time', icon: '⏱', name: '+15 seconds', short: '+15s', price: 60, desc: 'Adds 15 seconds to the clock (games with a clock).' },
  { id: 'x2',   icon: '✖2', name: 'Double points', short: '×2', price: 80, desc: 'Every point counts double for 20 seconds.' },
  { id: 'slow', icon: '🐢', name: 'Slow motion', short: 'Slow', price: 70, desc: 'Everything moves 40% slower for 20 seconds.' }
];
var AVATARS = ['🦊', '🐼', '🐯', '🦁', '🐸', '🐙', '🦄', '🐲', '🚀', '👾', '🤖', '🎩'];
var AVATAR_PRICE = 100;

    if (save.set.motion) {
      pills.forEach(function (p) {
        var m = p.dataset.fin.match(/^\+(\d+)(.*)$/); if (!m) return;
        var n = +m[1], t0 = performance.now();
        (function tick() { var k = Math.min(1, (performance.now() - t0) / 700); p.textContent = '+' + Math.round(n * k) + m[2]; if (k < 1 && p.dataset.fin) timers.push(setTimeout(tick, 40)); })();
      });
      if (cb) timers.push(setTimeout(function () { cb.firstChild.className = 'em'; cb.firstChild.textContent = '🎁' + cb.dataset.open; sfx('win'); }, 1100));
    } else finish();
    document.querySelector('.dlg').addEventListener('click', function (e) { if (!e.target.closest('button')) finish(); });
    sfx(won ? 'win' : 'bad');
    $('#coins').textContent = '🪙 ' + fmt(save.coins);
  }

  /* ---------- events ---------- */
  function on(sel, ev, fn) { $(sel).addEventListener(ev, fn); }
  function wire() {
    cv = $('#cv'); ctx = cv.getContext('2d');
    window.addEventListener('resize', fitCanvas);
    if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe($('#stage'));
    document.addEventListener('visibilitychange', function () { if (document.hidden && run && !run.over && !paused) doPause(); });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    function pos(e) { var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
    cv.addEventListener('pointerdown', function (e) { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) {} if (!run || paused || run.over) return; var p = pos(e); run.game.pd(p[0], p[1]); });
    cv.addEventListener('pointermove', function (e) { if (!run || paused || run.over) return; var p = pos(e); run.game.pm(p[0], p[1]); });
    var up = function (e) { if (!run || paused) return; var p = pos(e); run.game.pu(p[0], p[1]); };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

    $('#cards').addEventListener('click', function (e) { var b = e.target.closest('[data-g]'); if (b) { sfx('tick'); openGame(b.dataset.g); } });
    on('#lvBack', 'click', function () { renderHome(); show('home'); });
    on('#lvHelp', 'click', function () { modal('<h2>' + G.icon + ' ' + G.name + '</h2><p class="sub">' + G.how + '<br><i>' + G.howDe + '</i></p><div class="btns"><button class="pri" id="mClose">OK</button></div>'); });
    $('#pwr').addEventListener('click', function (e) { var b = e.target.closest('[data-pu]'); if (b) usePowerBtn(b.dataset.pu); });
    on('#tabLv', 'click', function () { renderLevels('lv'); });
    on('#tabTm', 'click', function () { renderLevels('tm'); });
    $('#lvBody').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var chal = !!($('#chal') && $('#chal').checked);
      if (b.id === 'goCur') startRun(curGame, topLevel(curGame), false, chal);
      else if (b.id === 'goTm') startRun(curGame, 1, true);
      else if (b.dataset.l) { if (b.dataset.lock) { sfx('bad'); return; } startRun(curGame, +b.dataset.l, false, chal); }
    });
    on('#gift', 'click', function () {
      var g = Prog.claimGift(save, today(), Math.random);
      var days = '', st = g ? g.streak : save.gift.streak, d;
      for (d = 1; d <= 7; d++) days += '<div class="' + (d <= st ? 'on' : '') + '">Day ' + d + '<br>' + (d === 7 ? '🎁' : '+' + (20 * d)) + '</div>';
      var how = '<p class="sub" style="text-align:left">🎁 <b>Daily gift</b>: open the game once a day and tap <b>Claim</b> on the start page to get coins. Play on consecutive days to build a streak: the coins grow each day, and <b>day 7 also gives a sticker</b>. Miss a day and the streak starts again. Spend coins in the 🛍 Shop on power-ups, dice skins, board looks and avatars.</p>';
      if (!g) { sfx('tick'); modal('<h2>🎁 Daily gift</h2><div class="sub">Already claimed today. Come back tomorrow!</div><div class="sub">Streak: day ' + save.gift.streak + ' of 7. Tomorrow: +' + (20 * (save.gift.streak >= 7 ? 1 : save.gift.streak + 1)) + ' 🪙</div><div class="gdays">' + days + '</div>' + how + '<div class="btns"><button class="pri" id="mClose">OK</button></div>'); return; }
      persist(); renderHome(); sfx('win');
      modal('<h2>🎁 Daily gift!</h2><div class="big">+' + g.coins + ' 🪙</div><div class="sub">Day ' + g.streak + ' of 7. Come back tomorrow for more!</div><div class="gdays">' + days + '</div>' +
        (g.sticker != null ? '<div class="reveal"><div class="em">' + STICKERS[g.sticker] + '</div>New sticker!</div>' : '') + how + '<div class="btns"><button class="pri" id="mClose">Yay!</button></div>');
    });
    on('#navSet', 'click', function () { renderSettings(); show('settings'); });
    on('#stBack', 'click', function () { renderHome(); show('home'); });
    $('#stBody').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.dataset.tog) {
        var k = b.dataset.tog;
        if (k === 'sound') save.sound = !save.sound; else save.set[k] = !save.set[k];
        persist(); applySettings(); renderSettings(); sfx('pop');
      } else if (b.dataset.set) {
        var v = b.dataset.val; save.set[b.dataset.set] = b.dataset.set === 'text' ? +v : v;
        persist(); applySettings(); renderSettings(); sfx('tick');
      } else if (b.id === 'exDl') {
        try {
          var blob = new Blob([JSON.stringify(save)], { type: 'application/json' }), u = URL.createObjectURL(blob), a = document.createElement('a');
          a.href = u; a.download = 'dice-arcade-backup-' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(u); }, 2000); setMsg('Backup file saved to your Downloads.');
        } catch (x) { setMsg('Could not create a file. Use "Copy save code" instead.'); }
      } else if (b.id === 'exCp') {
        var code = saveCode(), ta = $('#imTxt');
        var done = function () { setMsg('Save code copied. Paste it somewhere safe.'); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, function () { ta.value = code; ta.select(); setMsg('Copy the code from the box.'); });
        else { ta.value = code; ta.select(); setMsg('Copy the code from the box.'); }
      } else if (b.id === 'imGo') {
        var s = importData($('#imTxt').value);
        if (!s) { setMsg('That code does not look right. Nothing was changed.'); sfx('bad'); return; }
        modal('<h2>Restore this save?</h2><p class="sub">It has ' + fmt(s.coins) + ' coins and ' + Object.keys(s.stars).length + ' games of progress. Your current progress will be replaced.</p><div class="btns"><button id="mClose">Cancel</button><button class="pri" id="mImport">Restore</button></div>');
        window.__pendingImport = s;
      } else if (b.id === 'reset') askReset();
      else if (b.id === 'imFile') $('#imPick').click();
      else if (b.id === 'stTut') { save.seen = {}; persist(); setMsg('Tutorials will show again the first time you open each game.'); }
      else if (b.id === 'stDef') { save.set = {}; fixSet(save); persist(); applySettings(); renderSettings(); }
      else if (b.id === 'stUpd') {
        var um = $('#updMsg'); um.textContent = 'Checking…';
        var fin = function () { um.textContent = 'Loading the latest version…'; setTimeout(function () { location.reload(); }, 400); };
        if (location.protocol.indexOf('http') !== 0) { um.textContent = 'You are running a saved file. To update, open the new index.html file (or the web link) instead.'; return; }
        Promise.resolve(navigator.serviceWorker && navigator.serviceWorker.getRegistrations ? navigator.serviceWorker.getRegistrations() : []).then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
          .then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : 0; }).then(fin, fin);
      }
    });
    $('#stBody').addEventListener('input', function (e) {
      if (e.target.id === 'setVol') { save.set.vol = +e.target.value; persist(); }
      else if (e.target.id === 'setName') { save.set.name = e.target.value.replace(/[<>"&]/g, '').slice(0, 14); persist(); }
    });
    $('#stBody').addEventListener('change', function (e) {
      if (e.target.id === 'setVol') sfx('pop');
      if (e.target.id === 'imPick' && e.target.files && e.target.files[0]) {
        var fr = new FileReader();
        fr.onload = function () { $('#imTxt').value = String(fr.result).slice(0, 2000000); var s = importData(fr.result); setMsg(s ? 'File read. Tap "Restore from code" to continue.' : 'That file does not look right.'); };
        fr.readAsText(e.target.files[0]);
      }
    });
    on('#navAlbum', 'click', function () { renderAlbum(); show('album'); });
    on('#navSound', 'click', function () { save.sound = !save.sound; persist(); renderHome(); sfx('pop'); });
    on('#alBack', 'click', function () { renderHome(); show('home'); });
    function pay(b, price) { if (save.coins < price) { sfx('bad'); b.textContent = 'Need ' + (price - save.coins) + ' more 🪙'; return false; } save.coins -= price; sfx('win'); return true; }
    $('#shop').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var d = b.dataset;
      if (d.skin != null) { var i = +d.skin; if (save.skins.indexOf(i) < 0) { if (!pay(b, SKINS[i].price)) return; save.skins.push(i); } save.skin = i; setSkin(i); }
      else if (d.board != null) { var j = +d.board; if (save.boards.indexOf(j) < 0) { if (!pay(b, BOARDS[j].price)) return; save.boards.push(j); } save.board = j; setBoard(j); }
      else if (d.avatar != null) { if (save.avatars.indexOf(d.avatar) < 0) { if (!pay(b, AVATAR_PRICE)) return; save.avatars.push(d.avatar); } save.avatar = d.avatar; }
      else if (d.title != null) { var t = +d.title; if (save.titles.indexOf(t) < 0) { if (!pay(b, TITLES[t].price)) return; save.titles.push(t); } save.title = t; }
      else if (d.pu) { var pu = POWERUPS.filter(function (p) { return p.id === d.pu; })[0]; if (!pay(b, pu.price)) return; save.inv[pu.id] = (save.inv[pu.id] || 0) + 1; }
      else return;
      persist(); var y = $('#album').scrollTop; renderAlbum(); $('#album').scrollTop = y;
    });
    on('#profile', 'click', function () { renderAlbum(); show('album'); });
    var askReset = function () { modal('<h2>Reset everything?</h2><p class="sub">All stars, coins and stickers will be deleted.</p><div class="btns"><button id="mClose">Cancel</button><button class="pri" id="mReset">Reset</button></div>'); };
    on('#pause', 'click', function () { doPause(); });
    $('#modal').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var id = b.id;
      if (id === 'mClose') closeModal();
      else if (id === 'mGo') { closeModal(); paused = false; last = performance.now(); }
      else if (id === 'mImport' && window.__pendingImport) { save = window.__pendingImport; window.__pendingImport = null; persist(); setSkin(save.skin || 0); setBoard(save.board || 0); applySettings(); closeModal(); renderHome(); show('home'); }
      else if (id === 'mReset') { save = Prog.newSave(); fixSet(save); persist(); setSkin(0); setBoard(0); applySettings(); closeModal(); renderHome(); show('home'); }
      else if (id === 'pResume') { closeModal(); paused = false; last = performance.now(); }
      else if (id === 'pRestart' || id === 'rRetry') startRun(run.G.id, run.level, run.timed);
      else if (id === 'pQuit' || id === 'rBack') { closeModal(); run = null; cancelAnimationFrame(raf); openGame(curGame); }
      else if (id === 'rNext') startRun(run.G.id, run.level + 1, false);
    });
  }
  function doPause() {
    if (!run || run.over) return;
    paused = true;
    modal('<h2>Paused</h2><div class="btns" style="flex-direction:column"><button class="pri" id="pResume">▶ Resume</button><button id="pRestart">↻ Restart</button><button id="pQuit">Quit to levels</button></div>');
  }

  /* ---------- settings ---------- */
  function applySettings() {
    var b = document.body, s = save.set;
    b.classList.remove('t-ocean', 't-candy', 't-forest');
    if (s.theme !== 'night') b.classList.add('t-' + s.theme);
    var lk = s.look === 'auto' ? (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : (s.look === 'light' ? 'light' : 'dark');
    b.classList.toggle('lk-light', lk === 'light'); b.classList.toggle('lk-dark', lk === 'dark');
    b.classList.toggle('reduce', !s.motion); b.classList.toggle('lefty', !!s.lefty); b.classList.toggle('bigbtn', !!s.big);
    $('#app').style.zoom = s.text === 1 ? '' : s.text;
    var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = lk === 'light' ? '#f5f5f7' : (getComputedStyle(b).getPropertyValue('--bg') || '#12162b');
  }
  function seg(key, opts) {
    return '<div class="seg">' + opts.map(function (o) { return '<button data-set="' + key + '" data-val="' + o[0] + '" class="' + (String(save.set[key]) === String(o[0]) ? 'on' : '') + '">' + o[1] + '</button>'; }).join('') + '</div>';
  }
  function tog(key, on) { return '<button class="tg ' + (on ? 'on' : '') + '" data-tog="' + key + '">' + (on ? 'On' : 'Off') + '</button>'; }
  function renderSettings() {
    var s = save.set, h = '';
    h += '<div class="set"><h3>👤 Player</h3><div class="srow"><div class="lbl">Name<small>Shown on the home screen. Stays on this device.</small></div></div><input type="text" id="setName" maxlength="14" placeholder="Your name" value="' + (s.name || '').replace(/"/g, '') + '"></div>';
    h += '<div class="set"><h3>🔊 Sound and feel</h3>' +
      '<div class="srow"><div class="lbl">Sound effects</div>' + tog('sound', save.sound) + '</div>' +
      '<div class="srow"><div class="lbl">Volume</div><input type="range" id="setVol" min="0" max="1" step="0.05" value="' + s.vol + '"></div>' +
      '<div class="srow"><div class="lbl">Vibration<small>Short buzz on wins and mistakes (Android)</small></div>' + tog('vibe', s.vibe) + '</div>' +
      '<div class="srow"><div class="lbl">Animations and sparkles<small>Turn off for calmer visuals</small></div>' + tog('motion', s.motion) + '</div></div>';
    h += '<div class="set"><h3>🎮 Controls</h3>' +
      '<div class="srow"><div class="lbl">Hint button 💡<small>Off hides the hint in games</small></div>' + tog('hints', s.hints) + '</div>' +
      '<div class="srow"><div class="lbl">Big buttons<small>Larger control buttons for small hands</small></div>' + tog('big', s.big) + '</div>' +
      '<div class="srow"><div class="lbl">Left-handed layout<small>Mirrors the button order</small></div>' + tog('lefty', s.lefty) + '</div></div>';
    h += '<div class="set"><h3>🎨 Look</h3>' +
      '<div class="srow"><div class="lbl">Look<small>Dark is the default. Auto follows your phone.</small></div>' + seg('look', [['dark', '🌙 Dark'], ['light', '☀️ Light'], ['auto', 'Auto']]) + '</div>' +
      '<div class="srow"><div class="lbl">Colours (dark look)</div>' + seg('theme', [['night', '🌙 Night'], ['ocean', '🌊 Ocean'], ['candy', '🍬 Candy'], ['forest', '🌲 Forest']]) + '</div>' +
      '<div class="srow"><div class="lbl">Text and menu size</div>' + seg('text', [[0.9, 'S'], [1, 'M'], [1.15, 'L'], [1.3, 'XL']]) + '</div>' +
      '<div class="note">Dice skins are in 🎨 Stickers &amp; Shop.</div></div>';
    h += '<div class="set"><h3>💾 Save data</h3><div class="note">Everything is stored only on this device. Back it up before clearing browser data or changing phone.</div>' +
      '<div class="btns"><button id="exDl">⬇ Download backup</button><button id="exCp">📋 Copy save code</button></div>' +
      '<div class="note" style="margin-top:12px">Restore: paste a save code or choose a backup file.</div>' +
      '<textarea id="imTxt" placeholder="Paste save code here"></textarea>' +
      '<div class="btns"><button id="imGo">⬆ Restore from code</button><button id="imFile">📂 Choose backup file</button></div><input type="file" id="imPick" accept=".json,.txt,application/json,text/plain" class="hidden">' +
      '<div class="note" id="stMsg"></div>' +
      '<div class="btns"><button id="stTut">Show game tutorials again</button><button id="stDef">Reset settings</button></div>' +
      '<div class="btns"><button class="ghost" id="reset">Reset all progress</button></div></div>';
    h += '<div class="set"><h3>ℹ About</h3><div class="srow"><div class="lbl">Version<small>Dice Arcade ' + VERSION + ' · built ' + BUILD + ' · 50 levels per game</small></div></div>' +
      '<div class="btns"><button id="stUpd">🔄 Check for update</button></div><div class="note" id="updMsg"></div></div>';
    $('#stBody').innerHTML = h;
  }
  function saveCode() { return 'DICE1:' + btoa(unescape(encodeURIComponent(JSON.stringify(save)))); }
  function importData(txt) {
    try {
      txt = String(txt || '').trim();
      if (txt.indexOf('DICE1:') === 0) txt = decodeURIComponent(escape(atob(txt.slice(6))));
      var s = JSON.parse(txt), d = Prog.newSave();
      if (!s || s.v !== 1 || typeof s.coins !== 'number' || typeof s.xp !== 'number' || typeof s.stars !== 'object') return false;
      for (var k in d) if (!(k in s)) s[k] = d[k];
      fixSet(s); return s;
    } catch (e) { return false; }
  }
  function setMsg(t) { var m = $('#stMsg'); if (m) m.textContent = t; }

  function init() {
    save = load(); setSkin(save.skin || 0); setBoard(save.board || 0); applySettings();
    wire(); renderHome(); show('home');
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(function () {});
    window.__app = { get save() { return save; }, get run() { return run; }, startRun: startRun, Prog: Prog, Games: Games };
  }
  init();
})();

</script>
</body>
</html>
